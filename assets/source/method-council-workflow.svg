<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">Method Council workflow</title>
  <desc id="desc">A six-stage workflow moves from scope to method selection, separate method passes, challenge, synthesis, and a human checkpoint.</desc>
  <metadata>
    Original Method Council asset. Canonical editable source, version 0.1.0.
    Contract diagram, not a product screenshot.
  </metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2C4258"/>
    </marker>
    <style>
      .body { font-family: Sora, Inter, system-ui, sans-serif; fill: #11131A; }
      .meta { font-family: "JetBrains Mono", ui-monospace, monospace; fill: #536070; letter-spacing: 1.2px; }
      .label { font-size: 19px; font-weight: 650; }
      .small { font-size: 13px; }
    </style>
  </defs>
  <rect width="1120" height="400" fill="#F7F8F6"/>
  <path d="M48 58H1072" stroke="#11131A" stroke-opacity="0.14"/>
  <text x="48" y="39" class="meta small">METHOD COUNCIL / WORKFLOW / CONTRACT DIAGRAM</text>
  <text x="1072" y="39" text-anchor="end" class="meta small">REV 0.1</text>

  <path d="M118 194H1002" fill="none" stroke="#2C4258" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(48 126)">
    <rect width="150" height="136" fill="#FFFFFF" stroke="#11131A" stroke-opacity="0.28"/>
    <text x="16" y="27" class="meta small">01 / BOUND</text>
    <text x="16" y="66" class="body label">Scope</text>
    <text x="16" y="93" class="body small">Question</text>
    <text x="16" y="114" class="body small">Evidence boundary</text>
  </g>

  <g transform="translate(222 126)">
    <rect width="150" height="136" fill="#FFFFFF" stroke="#11131A" stroke-opacity="0.28"/>
    <text x="16" y="27" class="meta small">02 / VALIDATE</text>
    <text x="16" y="66" class="body label">Select</text>
    <text x="16" y="93" class="body small">Complementary</text>
    <text x="16" y="114" class="body small">method route</text>
  </g>

  <g transform="translate(396 110)">
    <rect width="156" height="168" fill="#E8EDF0" stroke="#2C4258" stroke-width="2"/>
    <text x="16" y="27" class="meta small">03 / SEPARATE</text>
    <text x="16" y="63" class="body label">Method passes</text>
    <path d="M18 86H138M18 111H138M18 136H138" stroke="#2C4258" stroke-width="3"/>
    <rect x="22" y="82" width="14" height="8" fill="#F7F8F6"/>
    <rect x="66" y="107" width="14" height="8" fill="#F7F8F6"/>
    <rect x="110" y="132" width="14" height="8" fill="#F7F8F6"/>
    <text x="16" y="158" class="body small">Typed artifacts</text>
  </g>

  <g transform="translate(576 126)">
    <rect width="150" height="136" fill="#FFFFFF" stroke="#A9563D" stroke-width="2"/>
    <text x="16" y="27" class="meta small">04 / TEST</text>
    <text x="16" y="66" class="body label">Challenge</text>
    <text x="16" y="93" class="body small">Counterevidence</text>
    <text x="16" y="114" class="body small">Failure path</text>
  </g>

  <g transform="translate(750 126)">
    <rect width="150" height="136" fill="#FFFFFF" stroke="#11131A" stroke-opacity="0.28"/>
    <text x="16" y="27" class="meta small">05 / COMPARE</text>
    <text x="16" y="66" class="body label">Synthesize</text>
    <text x="16" y="93" class="body small">Convergence</text>
    <text x="16" y="114" class="body small">and dissent</text>
  </g>

  <g transform="translate(924 126)">
    <rect width="148" height="136" fill="#F7F8F6" stroke="#11131A" stroke-width="2"/>
    <path d="M118 0H148V30" fill="none" stroke="#A9563D" stroke-width="7"/>
    <text x="16" y="27" class="meta small">06 / HUMAN</text>
    <text x="16" y="66" class="body label">Checkpoint</text>
    <text x="16" y="93" class="body small">Act, collect,</text>
    <text x="16" y="114" class="body small">or revise</text>
  </g>

  <path d="M48 328H1072" stroke="#11131A" stroke-opacity="0.14"/>
  <text x="48" y="353" class="body small">Model: apply methods and synthesize</text>
  <text x="1072" y="353" text-anchor="end" class="body small">Code: validate route, artifacts, evidence, and status</text>
</svg>
