name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Validate canonical catalog
        run: uv run method-council validate

      - name: Check Codex skill projection
        run: uv run python scripts/sync_codex_skill.py check

      - name: Recompute method screening report
        run: |
          uv run python scripts/evaluate_methods.py
          git diff --exit-code -- evals/methods/screening-report.json

      - name: Validate public fixtures
        run: uv run python scripts/validate_fixtures.py

      - name: Scan tracked-file hygiene
        run: uv run python scripts/tracked_file_hygiene.py

      - name: Build source and wheel artifacts
        run: uv build
