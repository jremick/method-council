name: Bug report
description: Report reproducible incorrect behavior in Method Council.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include secrets, private prompts, personal data, or vulnerability
        details. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host path
      options:
        - Deterministic CLI only
        - Codex subscription
        - Claude preview adapter
        - Gemini preview adapter
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use public-safe or synthetic inputs only.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private prompts, personal paths, and unrelated logs.
          required: true
        - label: This is not a vulnerability report.
          required: true
